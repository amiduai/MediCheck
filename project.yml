name: MediCheck
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
targets:
  MediCheck:
    type: application
    platform: macOS
    sources:
      - path: MediCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.MediCheck
        PRODUCT_NAME: MediCheck
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MediCheck/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
    entitlements:
      path: MediCheck/MediCheck.entitlements
      properties:
        com.apple.security.app-sandbox: true
  MediCheckTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MediCheckTests
    dependencies:
      - target: MediCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.MediCheckTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MediCheck:
    build:
      targets:
        MediCheck: all
        MediCheckTests: [test]
    test:
      targets:
        - MediCheckTests
